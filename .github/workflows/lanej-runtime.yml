name: Lanej runtime

on:
  push:
    branches: [lanej-runtime, lanej-runtime-next]
  pull_request:
    branches: [lanej-runtime, lanej-runtime-next]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-regressions:
    if: github.repository == 'lanej/zellij'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Install native build tools on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake pkg-config libssl-dev
      - name: Install native build tools on macOS
        if: runner.os == 'macOS'
        run: brew install cmake pkg-config openssl@3
      - name: Install pinned toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Cache native build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: lanej-runtime-debug-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: lanej-runtime-debug-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
      - name: Verify native reliability fixes
        run: |
          host=$(rustup run 1.95.0 rustc -vV | sed -n 's/^host: //p')
          test -n "$host"
          rustup run 1.95.0 cargo test --locked \
            -p zellij-server -p zellij-utils --lib --no-default-features \
            --features zellij-utils/vendored_curl,zellij-server/web_server_capability,zellij-utils/web_server_capability \
            --target "$host" dotfiles_
          rustup run 1.95.0 cargo test --locked \
            -p zellij-server -p zellij-client -p zellij-utils --lib --no-default-features \
            --features zellij-utils/vendored_curl,zellij-server/web_server_capability,zellij-client/web_server_capability,zellij-utils/web_server_capability \
            --target "$host" nested_
          rustup run 1.95.0 cargo test --locked \
            -p zellij-server -p zellij-utils --lib --no-default-features \
            --features zellij-utils/vendored_curl,zellij-server/web_server_capability,zellij-utils/web_server_capability \
            --target "$host" scroll_indicator
          rustup run 1.95.0 cargo test --locked \
            -p configuration --no-default-features \
            --features zellij-utils/vendored_curl,zellij-utils/web_server_capability \
            --target "$host"
          rustup run 1.95.0 cargo test --locked \
            -p zellij-integration-tests --test clients --no-default-features \
            --features zellij-utils/vendored_curl,zellij-server/web_server_capability,zellij-client/web_server_capability,zellij-utils/web_server_capability \
            --target "$host" cli_query_ignores_completion_from_another_panes_exit
          rustup run 1.95.0 cargo test --locked \
            -p zellij-server --lib --no-default-features \
            --features zellij-utils/vendored_curl,zellij-server/web_server_capability,zellij-utils/web_server_capability \
            --target "$host" -- --exact \
            screen::screen_tests::write_chars_without_a_target_reach_the_pane_under_a_focused_popup \
            screen::screen_tests::a_bracketed_paste_reaches_the_focused_popup_and_not_the_pane \
            screen::screen_tests::a_key_press_reaches_the_focused_popup_and_not_the_pane \
            screen::screen_tests::a_popup_asking_for_permissions_reports_its_focus_to_the_server
          rustup run 1.95.0 cargo test --locked \
            -p zellij-server -p zellij-utils --lib --no-default-features \
            --features zellij-utils/vendored_curl,zellij-server/web_server_capability,zellij-utils/web_server_capability \
            --target "$host" keyboard_copy
          rustup run 1.95.0 cargo test --locked \
            -p zellij-integration-tests --test keyboard_copy --no-default-features \
            --features zellij-utils/vendored_curl,zellij-server/web_server_capability,zellij-client/web_server_capability,zellij-utils/web_server_capability \
            --target "$host"
      - name: Verify configurable session nesting
        run: |
          host=$(rustup run 1.95.0 rustc -vV | sed -n 's/^host: //p')
          test -n "$host"
          for detector in session_switch config_settings server_client_contract; do
            rustup run 1.95.0 cargo test --locked \
              -p zellij-server -p zellij-client -p zellij-utils --lib --no-default-features \
              --features zellij-utils/vendored_curl,zellij-server/web_server_capability,zellij-client/web_server_capability,zellij-utils/web_server_capability \
              --target "$host" "$detector"
          done
          rustup run 1.95.0 cargo test --locked \
            -p zellij-integration-tests --test nested_session_policy --no-default-features \
            --features zellij-utils/vendored_curl,zellij-server/web_server_capability,zellij-client/web_server_capability,zellij-utils/web_server_capability \
            --target "$host"
